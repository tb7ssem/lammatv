<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop — LAMMA TV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23111111'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'>L</text></svg>">
</head>
<body>

<!-- Art symbols: loaded identically to index.html via a shared sprite file is cleaner,
     but for zero-dependency loading each page includes the sprite. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" id="sprite"></svg>

<!-- ============ UTILITY BAR ============ -->
<div class="utility-bar">
  <div class="container">
    <div class="logo" style="font-size:14px;font-family:var(--font-ui);font-weight:500">LAMMA TV</div>
    <div class="utility-links">
      <span>Free 24h trial · Instant WhatsApp activation</span>
      <a href="https://wa.me/21658877141" target="_blank" rel="noopener" class="admin-flag" style="background:#1eaa52" data-wa>WhatsApp Us</a>
      <a href="#">Support</a><a href="admin.html" style="color:var(--mute)">Admin</a>
    </div>
  </div>
</div>

<!-- ============ PRIMARY NAV ============ -->
<nav class="primary-nav"><div class="container" id="navContainer"></div></nav>

<main>
  <div class="container">
    <div class="breadcrumb"><a href="index.html">Home</a> / <span style="color:var(--ink)" id="crumb">All Products</span></div>
    <div class="section-header" style="margin-bottom:8px">
      <h2 class="heading-xl" id="catTitle">All Products</h2>
    </div>
  </div>
  <div class="container catalog-layout">
    <aside class="filter-sidebar" id="sidebar"></aside>
    <div>
      <div class="sort-row">
        <div class="chip-row" style="margin:0" id="chips"></div>
        <select id="sortSelect">
          <option value="featured">Sort By: Featured</option>
          <option value="price-asc">Price: Low to High</option>
          <option value="price-desc">Price: High to Low</option>
          <option value="name">Name: A-Z</option>
        </select>
      </div>
      <div class="product-grid" id="grid"></div>
      <div id="emptyState" class="cart-empty" style="display:none">No products match those filters.</div>
      <div id="waHint" class="cart-empty" style="margin-top:32px">Can't find what you want? <a class="link-md" style="font-size:14px" data-wa target="_blank" rel="noopener" href="https://wa.me/21658877141">Ask us on WhatsApp</a> — we can source almost any electronics.</div>
    </div>
  </div>
</main>

<div id="siteFooter"></div>

<a class="wa-float" href="https://wa.me/21658877141" target="_blank" rel="noopener" aria-label="Chat on WhatsApp" data-wa>
  <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 2a8 8 0 1 1-4.1 14.9l-.4-.2-2.9.8.8-2.7-.2-.4A8 8 0 0 1 12 4z"/></svg>
</a>

<div class="drawer-backdrop" id="drawerBackdrop"></div>
<aside class="cart-drawer" id="cartDrawer">
  <div class="cart-head">
    <span>Bag <small id="cartHeadCount" style="color:var(--mute)"></small></span>
    <button class="icon-btn" id="cartClose" style="background:var(--soft-cloud)">✕</button>
  </div>
  <div class="cart-items" id="cartItems"></div>
  <div class="cart-foot">
    <div class="cart-line"><span>Subtotal</span><span id="cartSubtotal">–</span></div>
    <button class="btn-primary" style="width:100%;margin-top:8px;background:#1eaa52" id="checkoutBtn">Order via WhatsApp</button>
  </div>
</aside>

<div class="toast" id="toast">Added to Bag</div>

<script src="data.js"></script>
<script src="sprite.js"></script>
<script src="common.js"></script>
<script src="shop.js"></script>
</body>
</html>
